<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login website</title>
    <style>
        body{
    margin: 0;
    padding: 0;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;   
    display: flex;
    justify-content: center;
    padding-top: 150px;
    background-image: url(image/new\ image.jpeg);
}

.login{
    width: 270px;
    height: 300px;
    background: transparent;
    padding-left: 40px;
    border-radius: 20px;
    backdrop-filter:blur(60px);
    box-shadow: 0 0 10 rgb(0, 0, 0 .1);
    border: 1px solid white;
    color: #fff;

}

h1{
 padding-left: 60px;
 color: #fff;
 background: transparent;
}
.input-box{
    margin-top: 15px;
    padding-top: 8px;
    padding-bottom: 8px;
    padding-right: 60px;
    border-radius: 20px;
    padding-left: 10px;
    background: transparent;
    color: #690707;
    border: 1px solid rgb(255, 255, 255 .2);
}

.input-box input::placeholder{
    color: #fff;
}
label{
    font-size: 12px;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    color: #fff;
}

.checkbox1{
    font-size: 20px;
    color: #fff;
    margin-top: 10px;
    padding-bottom: 30px;
}

.password{
    margin-left: 50px;
    font-size: 12px;
    color: #fff;
    text-decoration: none;
}

button{
    margin-top: 10px;
    padding-top: 8px;
    padding-bottom: 8px;
    padding-right: 110px;
    border-radius: 20px;
    padding-left: 100px;
    box-shadow: 0 0 10px rgb(0, 0, 0 .1);
    color: #333;

}
button:hover{
    background-color: #ff7200;
}

p{
    font-size: 13px;
    margin-left: 40px;
    color: #fff;
}

a{
    color: #fff;
}
a:hover{
    color: blue;
}
    </style>
</head>
<body>
    <div class="login">
        <h1>Login</h1>

        <form action="login">
            <input type="text" name="username" class="input-box" placeholder="&#128100; Username" required="true"><br>

            <input type="password" name="password" class="input-box" placeholder="&#128274;  Password" required="true"><br>

            <label for=""><input type="checkbox" name="remember" class="checkbox1"> Remember me</label>
            
            <a class="password" href="#">forget password?</a><br>

            <button>Login</button>

            <p>Don't have an account? <a href="#">Register </a></p>
        </form>
    </div>
</body>
</html>
