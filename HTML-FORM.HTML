<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* General page styling */
body {
    font-family: Arial, sans-serif;
    background: #f4f4f9;
    margin: 0;
    padding: 20px;
}

/* Heading */
h1 {
    text-align: center;
    color: #333;
}

/* Form container */
form {
    max-width: 500px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
}

/* Fieldset and legend */
fieldset {
    border: 2px solid #007BFF;
    border-radius: 6px;
    padding: 15px;
}

legend {
    font-weight: bold;
    color: #007BFF;
}

/* Labels */
label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
    color: #444;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

/* Checkbox styling */
input[type="checkbox"] {
    width: auto;
    margin-right: 5px;
}

/* Submit and reset buttons */
input[type="submit"], input[type="reset"] {
    width: 48%;
    padding: 10px;
    margin-top: 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

input[type="submit"] {
    background: #28a745;
    color: white;
}

input[type="reset"] {
    background: #dc3545;
    color: white;
}

/* Hover effects */
input[type="submit"]:hover {
    background: #218838;
}

input[type="reset"]:hover {
    background: #c82333;
}

    </style>
</head>
<body>
    <h1> HTML-FORM</h1>
    <hr>

    <form>
        <fieldset>
            <legend>html-form</legend>
        <labal for="username">Name</labal>
        <input type="username" name="username" id="username" placeholder="Enter your name" required="true"/>
        <br>

        <labal for="email">Email</labal>
        <input type="email" name="email" id="email" placeholder="Enter your email"  required="true"/>
        <br>

        <labal for="password"> password</labal>
        <input type="password" name="password" id="password" placeholder="Enter your password"  required="true"/>
        <br>

        <labal for="number"> Number</labal>
        <input type="phone" name="phone" id="phone" placeholder="Enter your number"  required="true">
        <br>

        <labal for="color"> color</labal>
        <input type="color" name="color" id="color"   required="true">
        <br>

        <labal for="date"> date of birth</labal>
        <input type="date" name="date" id="date" required="true"/>
        <br>

        <labal for="date"> date & time</labal>
        <input type="datetime-local" name="datetime" id="datetime" required="true"/>
        <br>

        <labal for="month">Month</labal>
        <input type="month" name="month" id="month" required="true"/>
        <br>

        <labal for="week">Week</labal>
        <input type="week" name="week" id="week"   required="true">
        <br>

        <labal for="resume">Resume</labal>
        <input type="file" name="resume" id="resume" accept=".pdf" required="true"/>
        <br>

        <p>select any option</p>
        <labal> <input type="checkbox" value="mca">MCA</labal>
        <labal><input type="checkbox" value="bca"/>BCA</labal>
        <br>

        <p>Qualification:</p> 
        <select name="qualification" required="true"> 
            <option vale="">select</option>
            <option value="10">10th</option> 
            <option value="12">12th</option> 
            <option value="graduation">Graduation</option> 
        </select>
        <br> 

        <input type="submit" value="submit"/>
        <input type="reset" value="reset"/>
        </fieldset>
             
    </form>
</body>
</html>
